<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ハチドリ NEWS PICK</title>
    <meta
      name="description"
      content="地球と社会にやさしいニュースを、ハチドリ電力との相性順でチェック。"
    />
    <meta property="og:title" content="ハチドリ NEWS PICK" />
    <meta
      property="og:description"
      content="地球と社会にやさしいニュースを、ひと目で。"
    />
    <meta
      property="og:image"
      content="https://hirokiinoue0602.github.io/hachidori-news-pick/og.png"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./og.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="brand" href="./" aria-label="ハチドリ NEWS PICK ホーム">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>ハチドリ</span>
          <strong>NEWS PICK</strong>
        </a>
        <button class="refresh-button" id="refresh" type="button">
          <span class="refresh-icon" id="refresh-icon" aria-hidden="true">↻</span>
          <span id="refresh-label">最新に更新</span>
        </button>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">TODAY'S GOOD NEWS</p>
          <h1>今日、何を<br />投稿しよう？</h1>
          <p class="lead">
            地球や社会にやさしいニュースを、<br class="desktop-break" />
            ハチドリ電力との相性順で集めました。
          </p>
        </div>
        <div class="hero-note">
          <span class="note-number" id="item-count">…</span>
          <span class="note-label">件の新着候補</span>
          <span class="note-date" id="updated-at">読み込み中</span>
        </div>
      </section>

      <section class="news-section" id="news-section" aria-busy="true">
        <div class="toolbar">
          <div class="category-list" aria-label="テーマで絞り込む">
            <button class="category active" data-category="すべて" aria-pressed="true">
              すべて
            </button>
            <button class="category" data-category="再エネ" aria-pressed="false">
              再エネ
            </button>
            <button
              class="category"
              data-category="電力・暮らし"
              aria-pressed="false"
            >
              電力・暮らし
            </button>
            <button
              class="category"
              data-category="脱炭素・気候"
              aria-pressed="false"
            >
              脱炭素・気候
            </button>
            <button
              class="category"
              data-category="サステナブル"
              aria-pressed="false"
            >
              サステナブル
            </button>
            <button
              class="category"
              data-category="社会・地域"
              aria-pressed="false"
            >
              社会・地域
            </button>
          </div>
          <label class="sort-control">
            <span>並び順</span>
            <select id="sort">
              <option value="recommended">おすすめ順</option>
              <option value="newest">新着順</option>
            </select>
          </label>
        </div>

        <div class="result-summary" aria-live="polite">
          <span id="result-count">ニュースを探しています</span>
          <span class="quiet-note" id="warning"></span>
        </div>

        <div id="loading" class="news-grid" aria-label="読み込み中"></div>
        <div id="error" class="error-state" hidden></div>
        <div id="empty" class="empty-state" hidden>
          <span>このテーマの新着候補はありません</span>
          <button id="show-all" type="button">すべてのニュースを見る</button>
        </div>
        <div id="news-grid" class="news-grid" hidden></div>
      </section>

      <footer>
        <p>
          自動選定は投稿ネタ探しの入口です。発信前に元記事の内容・日付・数値をご確認ください。
        </p>
        <span>HACHIDORI NEWS PICK</span>
      </footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
