<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ハチドリ NEWS PICK</title>
    <meta
      name="description"
      content="地球と社会にやさしいニュースを、ハチドリ電力との相性順でチェック。"
    />
    <meta property="og:title" content="ハチドリ NEWS PICK" />
    <meta
      property="og:description"
      content="地球と社会にやさしいニュースを、ひと目で。"
    />
    <meta
      property="og:image"
      content="https://hirokiinoue0602.github.io/hachidori-news-pick/og.png"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./og.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="brand" href="./" aria-label="ハチドリ NEWS PICK ホーム">
          <span>ハチドリ電力</span>
          <strong>NEWS PICK</strong>
          <small>社内用</small>
        </a>
        <button class="refresh-button" id="refresh" type="button">
          <span class="refresh-icon" id="refresh-icon" aria-hidden="true">↻</span>
          <span id="refresh-label">最新に更新</span>
        </button>
      </header>

      <section class="news-section" id="news-section" aria-busy="true">
        <div class="list-header">
          <div>
            <p class="tool-label">ニュース収集</p>
            <h1>ニュース一覧</h1>
            <div class="list-meta" aria-live="polite">
              <span id="result-count">ニュースを探しています</span>
              <span id="updated-at">読み込み中</span>
              <span id="warning"></span>
            </div>
          </div>
          <label class="sort-control">
            <span>並び順</span>
            <select id="sort">
              <option value="recommended">おすすめ順</option>
              <option value="newest">新着順</option>
            </select>
          </label>
        </div>

        <div id="loading" class="news-list" aria-label="読み込み中"></div>
        <div id="error" class="error-state" hidden></div>
        <div id="empty" class="empty-state" hidden>
          <span>表示できるニュースはありません</span>
        </div>
        <div id="news-grid" class="news-list" hidden></div>
      </section>

      <footer>
        <p>
          自動選定は投稿ネタ探しの入口です。発信前に元記事の内容・日付・数値をご確認ください。
        </p>
        <span>HACHIDORI NEWS PICK</span>
      </footer>
    </main>

    <dialog class="draft-dialog" id="draft-dialog" aria-labelledby="draft-dialog-title">
      <div class="dialog-header">
        <div>
          <p class="dialog-eyebrow">COPY &amp; POST</p>
          <h2 id="draft-dialog-title">投稿案</h2>
        </div>
        <button class="dialog-close" id="dialog-close" type="button" aria-label="閉じる">
          ×
        </button>
      </div>

      <div class="dialog-article">
        <span id="dialog-source"></span>
        <strong id="dialog-article-title"></strong>
      </div>

      <div class="draft-panels">
        <section class="draft-panel">
          <div class="draft-heading">
            <div>
              <span class="channel-mark x-mark">X</span>
              <h3>X投稿用</h3>
            </div>
            <span class="character-count" id="x-character-count"></span>
          </div>
          <textarea id="x-draft" readonly aria-label="X投稿用の文章"></textarea>
          <button class="copy-button" data-copy-target="x-draft" type="button">
            X投稿文をコピー
          </button>
        </section>

        <section class="draft-panel">
          <div class="draft-heading">
            <div>
              <span class="channel-mark line-mark">LINE</span>
              <h3>オープンチャット用</h3>
            </div>
          </div>
          <textarea id="line-draft" readonly aria-label="LINEオープンチャット投稿用の文章"></textarea>
          <button class="copy-button" data-copy-target="line-draft" type="button">
            LINE投稿文をコピー
          </button>
        </section>
      </div>

      <p class="draft-note">
        投稿前に元記事を開き、内容・日付・数値に相違がないかご確認ください。
      </p>
    </dialog>
    <div class="copy-toast" id="copy-toast" role="status" aria-live="polite" hidden>
      コピーしました
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
